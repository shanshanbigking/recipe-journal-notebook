<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>料理鼠王 · (*¯︶¯*)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap');
    :root { --ink:#44352c; --muted:#8c7779; --paper:#fffafa; --cream:#f9eff1; --orange:#cf7988; --pink:#f3dce1; --pink-deep:#e8c5cd; --line:#eddde0; --shadow:0 15px 40px rgba(119,78,87,.11); }
    *{box-sizing:border-box} body{margin:0;background:#fbf4f5;color:var(--ink);font-family:Nunito,"Noto Serif SC",sans-serif;min-height:100vh}
    button,input,textarea,select{font:inherit} button{cursor:pointer;border:0}
    .top{max-width:1200px;margin:0 auto;padding:24px 32px 13px;display:flex;justify-content:space-between;align-items:center}.brand{font-family:"Noto Serif SC",serif;font-size:22px;font-weight:700;letter-spacing:1px}.brand i{font-style:normal;color:var(--orange)}.top-note{color:var(--muted);font-size:14px}.wrap{max-width:1200px;margin:auto;padding:17px 32px 52px}
    .hero{display:grid;grid-template-columns:1.28fr .72fr;gap:22px;margin-bottom:24px}.welcome{padding:35px 42px;border-radius:28px;background:linear-gradient(118deg,#faeaed,#f5dce1);min-height:210px;position:relative;overflow:hidden}.welcome:after{content:"✿";font-size:175px;position:absolute;right:29px;top:12px;color:#fff8f9;opacity:.85}.kicker{font-size:13px;letter-spacing:1.6px;color:#ad7782;font-weight:800}.welcome h1{font-family:"Noto Serif SC",serif;font-size:35px;margin:10px 0 7px;position:relative;z-index:1}.welcome p{margin:0;color:#8e626b;position:relative;z-index:1}.quote{background:linear-gradient(145deg,#f9e6e9,#f2d2d9);border-radius:28px;color:#74515a;padding:29px;display:flex;flex-direction:column;justify-content:space-between}.quote em{font-family:"Noto Serif SC",serif;font-size:21px;font-style:normal;line-height:1.65;outline:none;border-radius:8px}.quote em:focus,.quote span:focus{box-shadow:0 0 0 2px rgba(255,255,255,.7);background:rgba(255,255,255,.3)}.quote span{font-size:13px;opacity:.75;outline:none;border-radius:6px}
    .tabs{display:flex;gap:8px;margin:10px 0 20px}.tab{padding:11px 19px;border-radius:20px;background:transparent;color:var(--muted);font-weight:800}.tab.active{background:var(--ink);color:white}.view{display:none}.view.active{display:block}
    .book{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;border:1px solid #f3e5e7}.page{padding:32px 36px;min-height:570px}.page + .page{border-left:2px dashed var(--line)}h2{font-family:"Noto Serif SC",serif;margin:0 0 20px;font-size:25px}.date-line{font-size:14px;color:var(--orange);font-weight:800;margin-bottom:6px}.field{margin-bottom:16px}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;margin-bottom:7px}input,textarea,select{width:100%;border:1px solid #ecd9de;background:#fff9fa;color:var(--ink);border-radius:11px;padding:11px 13px;outline-color:#d997a4}textarea{resize:vertical;min-height:73px}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.rating{display:flex;gap:8px;align-items:center}.star{font-size:28px;padding:0;background:none;color:#dacdbb;line-height:1;width:32px}.star.on{color:#e8a13b}.star.half{color:transparent;background:linear-gradient(90deg,#e8a13b 50%,#dacdbb 50%);-webkit-background-clip:text;background-clip:text}.save{background:var(--orange);color:#fff;padding:12px 21px;border-radius:13px;font-weight:800;box-shadow:0 7px 14px rgba(207,121,136,.2)}.review-block{padding:12px 0;border-top:1px dashed var(--line)}.review-block:first-child{border-top:0;padding-top:0}.review-head{display:flex;align-items:center;gap:8px;margin:0 0 7px}.reviewer-name{border:0;background:transparent;padding:3px 0;border-radius:0;font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;min-width:0;flex:1}.reviewer-name:focus{border-bottom:1px solid var(--orange);outline:none}.remove-reviewer,.add-reviewer{color:var(--orange);background:transparent;font-weight:800;padding:3px 0;font-size:12px}.add-reviewer{margin-top:5px}
    .duration-input{position:relative}.duration-input input{padding-right:47px}.duration-input span{position:absolute;right:13px;top:11px;font-size:13px;color:var(--muted);pointer-events:none}.ingredient-upload{display:flex!important;margin-top:9px;height:74px;border:1px dashed #e6cbd1;border-radius:11px;background:#fff9fa;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative;color:#af828c!important;cursor:pointer}.ingredient-upload:hover{border-color:var(--orange)}.ingredient-upload img{width:100%;height:100%;object-fit:cover}.ingredient-upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.upload{height:222px;border:10px solid #fff;border-bottom-width:37px;border-radius:4px;background:#f8e8ec;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative;color:var(--muted);box-shadow:0 9px 19px rgba(146,93,105,.15);transform:rotate(-.4deg)}.upload:hover{box-shadow:0 10px 24px rgba(207,121,136,.26)}.upload span{font-size:38px;display:block}.upload img{width:100%;height:100%;object-fit:cover}.upload input{position:absolute;inset:0;opacity:0;cursor:pointer}.tip{font-size:12px;color:var(--muted);line-height:1.6;margin-top:13px}.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.card{background:var(--paper);border:1px solid #f0e2d0;border-radius:19px;overflow:hidden;box-shadow:0 8px 21px rgba(97,67,42,.07);transition:.2s}.card:hover{transform:translateY(-3px)}.card-img{height:155px;background:#f8e8ec;display:flex;align-items:center;justify-content:center;font-size:51px}.card-img img{width:100%;height:100%;object-fit:cover}.missing-photo{font-size:13px;color:#b58a94;text-align:center;line-height:1.7}.missing-photo b{display:block;font-size:26px;font-weight:400}.card-body{padding:17px}.card-date{font-size:12px;color:var(--orange);font-weight:800}.card h3{font-family:"Noto Serif SC",serif;margin:7px 0;font-size:19px}.card p{margin:0;color:var(--muted);font-size:13px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.empty{padding:52px;text-align:center;color:var(--muted);background:var(--paper);border-radius:24px;border:1px dashed var(--line)}
    .detail{background:var(--paper);border-radius:24px;padding:31px 36px;box-shadow:var(--shadow)}.back,.edit-entry,.download-entry{background:transparent;color:var(--orange);font-weight:800;padding:0;margin-bottom:20px}.edit-entry,.download-entry{float:right}.download-entry{margin-right:18px}.detail-grid{display:grid;grid-template-columns:.9fr 1.1fr;gap:33px;clear:both}.detail-photo{height:310px;border-radius:18px;background:#f8e8ec;display:grid;place-items:center;font-size:90px;overflow:hidden}.detail-photo img{width:100%;height:100%;object-fit:cover}.ingredient-detail-photo{width:100%;max-height:190px;object-fit:cover;border-radius:12px;margin-top:9px;border:1px solid var(--line)}.detail h1{font-family:"Noto Serif SC",serif;margin:3px 0 15px}.section{border-top:1px solid var(--line);padding-top:15px;margin-top:15px}.section h4{font-size:12px;letter-spacing:1px;color:var(--orange);margin:0 0 7px}.section p{line-height:1.7;margin:0;white-space:pre-line}.hidden{display:none}
    .outing{background:var(--paper);border-radius:24px;padding:30px 35px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr .9fr;gap:30px}.outing h2{grid-column:1/-1;margin-bottom:-4px}.outing-photo{height:250px;border:10px solid #fff;border-bottom-width:37px;background:#f8e8ec;box-shadow:0 9px 19px rgba(146,93,105,.15);display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative;color:var(--muted);transform:rotate(.4deg)}.outing-photo img{width:100%;height:100%;object-fit:cover}.outing-photo input{position:absolute;inset:0;opacity:0;cursor:pointer}.outing-list-title{font-family:"Noto Serif SC",serif;margin:28px 0 12px}.outing-card .card-img{height:140px}.outing-card{cursor:default}.outing-card p{margin-top:8px}.outings-empty{grid-column:1/-1}.outing-full{grid-column:1/-1}.save-row{display:flex;align-items:center;gap:14px}.save-row .tip{margin:0}@media(max-width:760px){.top,.wrap{padding-left:17px;padding-right:17px}.top-note{display:none}.hero,.book,.detail-grid,.outing{grid-template-columns:1fr}.welcome{min-height:185px;padding:29px}.welcome h1{font-size:29px}.page{padding:26px 21px;min-height:auto}.page+.page{border-left:0;border-top:2px dashed var(--line)}.memory-grid{grid-template-columns:1fr 1fr}.detail{padding:24px 20px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">料理鼠王 <i>·</i> (*¯︶¯*)</div><div class="top-note" id="today"></div></header>
  <main class="wrap">
    <section class="hero"><div class="welcome"><div class="kicker">MY KITCHEN DIARY</div><h1>人生忽如寄，莫辜负茶、汤、好天气</h1><p>今天也带着好心情珍惜粮食吧</p></div><div class="quote"><em id="quoteText" contenteditable="true" role="textbox" aria-label="可编辑的厨房小语">“好吃的东西，总值得被认真记下。”</em><span id="quoteSignature" contenteditable="true" role="textbox" aria-label="可编辑的厨房小语署名">— 点击文字即可修改，会自动保存</span></div></section>
    <nav class="tabs"><button class="tab active" data-target="write">写一页</button><button class="tab" data-target="outings">外出品鉴</button><button class="tab" data-target="memories">翻阅手账</button></nav>
    <section id="write" class="view active"><div class="book"><div class="page"><div class="date-line" id="dateLabel"></div><h2>今天吃什么？</h2><div class="field"><label>菜谱名称</label><input id="title" placeholder="例如：番茄奶油意面" /></div><div class="split"><div class="field"><label>料理类型</label><select id="category"><option>素菜</option><option>荤菜</option><option>汤</option><option>甜品</option><option>面食</option></select></div><div class="field"><label>烹饪时长</label><div class="duration-input"><input id="duration" inputmode="numeric" placeholder="例如：30" /><span>分钟</span></div></div></div><div class="field"><label>食材</label><textarea id="ingredients" placeholder="番茄 2 个、意面 100g、淡奶油…"></textarea><label class="ingredient-upload" id="ingredientUpload"><div id="ingredientUploadHint">＋ 插入食材准备图</div><input id="ingredientPhoto" type="file" accept="image/*" /></label></div><div class="field"><label>调料与比例</label><textarea id="seasoning" placeholder="盐 1/2 茶匙、黑胡椒少许…"></textarea></div><div class="field"><label>注意事项</label><textarea id="caution" placeholder="火候、过敏原、下次想调整的步骤…"></textarea></div></div><div class="page"><h2>这一餐的模样</h2><label class="upload" id="upload"><div id="uploadHint"><span>＋</span>放一张成品照片<br><small>点击上传，照片仅保存在这台设备中</small></div><input id="photo" type="file" accept="image/*" /></label><div class="field" style="margin-top:17px"><label>食后感</label><div id="reviews"></div><button class="add-reviewer" id="addReviewer" type="button">＋ 添加评价人</button></div><button class="save" id="save">保存这一页 ✿</button><p class="tip">所有记录都会保存在当前浏览器中，可以随时翻阅与回味。</p></div></div></section>
    <section id="outings" class="view"><div class="outing"><h2>外出吃饭 · 品鉴小记</h2><div><div class="field"><label>店名</label><input id="outingName" placeholder="例如：巷口意面小馆" /></div><div class="field"><label>地址</label><input id="outingAddress" placeholder="例如：上海市…" /></div><div class="field"><label>品尝菜品</label><textarea id="outingDishes" placeholder="写下今天点的菜、饮品或甜点…"></textarea></div><div class="field"><label>品鉴评价</label><div id="outingReviews"></div><button class="add-reviewer" id="addOutingReviewer" type="button">＋ 添加评价人</button></div></div><div><label class="outing-photo" id="outingPhoto"><div id="outingPhotoHint"><span>＋</span>插入探店照片<br><small>门头、餐点或一起吃饭的瞬间</small></div><input id="outingPhotoInput" type="file" accept="image/*" /></label><div class="save-row" style="margin-top:18px"><button class="save" id="saveOuting">保存品鉴记录 ✿</button><span class="tip">保存在这台设备中</span></div></div><div class="outing-full"><h3 class="outing-list-title">我的品鉴记录</h3><div id="outingEntries" class="memory-grid"></div><div id="outingEmpty" class="empty outings-empty hidden">还没有外出品鉴记录。<br>下一顿好吃的，值得被好好记住。</div></div></div></section>
    <section id="memories" class="view"><div id="entries" class="memory-grid"></div><div id="empty" class="empty hidden">还没有写下任何一餐。<br>从第一道菜开始，慢慢把日子装进手账里吧 ✿</div></section>
    <section id="detail" class="view"><div class="detail"><button class="back" id="back">← 回到手账</button><div id="detailContent"></div></div></section>
  </main>
  <script>
    const $=id=>document.getElementById(id), key='recipe-journal-entries-v1', outingsKey='recipe-journal-outings-v1', quoteKey='recipe-journal-quote-v1', signatureKey='recipe-journal-quote-signature-v1'; let imageData='', ingredientImageData='', outingImageData='', editingId=null, reviews=[], outingReviews=[];
    const date=new Date(), defaultReviews=()=>[{name:'小妍',rating:0,note:''},{name:'山山',rating:0,note:''}]; reviews=defaultReviews();outingReviews=defaultReviews();
    $('today').textContent=date.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'}); $('dateLabel').textContent=date.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});
    function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))} function all(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return[]}} function allOutings(){try{return JSON.parse(localStorage.getItem(outingsKey)||'[]')}catch{return[]}} function go(id){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active')); $(id).classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.target===id))}
    const reviewsFromEntry=e=>Array.isArray(e.reviews)?e.reviews.map(r=>({name:r.name||'评价人',rating:+r.rating||0,note:r.note||''})):[{name:'小妍',rating:+(e.ratings?.xiaoyan??e.rating??0),note:e.notesXiaoyan||e.notes||''},{name:'山山',rating:+(e.ratings?.shanshan??0),note:e.notesShanshan||''}];
    const scoreLabel=value=>value?`${value} / 5 分`:'未评分'; const durationLabel=value=>{const clean=String(value||'').replace(/\s*(分钟|分)\s*$/,'').trim();return clean?`${clean} 分钟`:''};
    function renderReviews(){const stars=(review,i)=>[1,2,3,4,5].map(v=>`<button class="star ${v<=review.rating?'on':v-.5===review.rating?'half':''}" data-review="${i}" data-v="${v}" type="button">★</button>`).join(''),root=$('reviews');root.innerHTML=reviews.map((r,i)=>`<div class="review-block"><div class="review-head"><input class="reviewer-name" data-review="${i}" value="${esc(r.name)}" aria-label="评价人姓名"><button class="remove-reviewer" data-remove="${i}" type="button">删除</button></div><div class="rating" aria-label="${esc(r.name)}评分">${stars(r,i)}<span style="color:var(--muted);font-size:13px">${scoreLabel(r.rating)}</span></div><textarea class="reviewer-note" data-review="${i}" placeholder="${esc(r.name)}的食后感…" style="margin-top:8px;min-height:58px">${esc(r.note)}</textarea></div>`).join('');root.querySelectorAll('.reviewer-name').forEach(x=>x.oninput=()=>reviews[+x.dataset.review].name=x.value);root.querySelectorAll('.reviewer-note').forEach(x=>x.oninput=()=>reviews[+x.dataset.review].note=x.value);root.querySelectorAll('.star').forEach(x=>x.onclick=e=>{const rect=x.getBoundingClientRect(),i=+x.dataset.review;reviews[i].rating=+(+x.dataset.v-(e.clientX-rect.left<rect.width/2?.5:0)).toFixed(1);renderReviews()});root.querySelectorAll('.remove-reviewer').forEach(x=>x.onclick=()=>{reviews.splice(+x.dataset.remove,1);renderReviews()})}
    $('addReviewer').onclick=()=>{reviews.push({name:'新评价人',rating:0,note:''});renderReviews()};
    function renderOutingReviews(){const stars=(review,i)=>[1,2,3,4,5].map(v=>`<button class="star ${v<=review.rating?'on':v-.5===review.rating?'half':''}" data-review="${i}" data-v="${v}" type="button">★</button>`).join(''),root=$('outingReviews');root.innerHTML=outingReviews.map((r,i)=>`<div class="review-block"><div class="review-head"><input class="reviewer-name" data-review="${i}" value="${esc(r.name)}" aria-label="评价人姓名"><button class="remove-reviewer" data-remove="${i}" type="button">删除</button></div><div class="rating" aria-label="${esc(r.name)}评分">${stars(r,i)}<span style="color:var(--muted);font-size:13px">${scoreLabel(r.rating)}</span></div><textarea class="reviewer-note" data-review="${i}" placeholder="${esc(r.name)}的品鉴感受…" style="margin-top:8px;min-height:58px">${esc(r.note)}</textarea></div>`).join('');root.querySelectorAll('.reviewer-name').forEach(x=>x.oninput=()=>outingReviews[+x.dataset.review].name=x.value);root.querySelectorAll('.reviewer-note').forEach(x=>x.oninput=()=>outingReviews[+x.dataset.review].note=x.value);root.querySelectorAll('.star').forEach(x=>x.onclick=e=>{const rect=x.getBoundingClientRect(),i=+x.dataset.review;outingReviews[i].rating=+(+x.dataset.v-(e.clientX-rect.left<rect.width/2?.5:0)).toFixed(1);renderOutingReviews()});root.querySelectorAll('.remove-reviewer').forEach(x=>x.onclick=()=>{outingReviews.splice(+x.dataset.remove,1);renderOutingReviews()})}
    $('addOutingReviewer').onclick=()=>{outingReviews.push({name:'新评价人',rating:0,note:''});renderOutingReviews()};
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{go(b.dataset.target);if(b.dataset.target==='memories') render();if(b.dataset.target==='outings') renderOutings()});
    const quote=$('quoteText'), signature=$('quoteSignature'); quote.textContent=localStorage.getItem(quoteKey)||quote.textContent; signature.textContent=localStorage.getItem(signatureKey)||signature.textContent; quote.addEventListener('input',()=>localStorage.setItem(quoteKey,quote.textContent)); signature.addEventListener('input',()=>localStorage.setItem(signatureKey,signature.textContent));
    function renderUpload(){const content=imageData?`<img id="preview" src="${imageData}" alt="成品照片">`:'<div id="uploadHint"><span>＋</span>放一张成品照片<br><small>点击上传，照片仅保存在这台设备中</small></div>';$('upload').innerHTML=`${content}<input id="photo" type="file" accept="image/*" />`;$('photo').onchange=handlePhoto}
    function handlePhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{imageData=r.result;renderUpload()};r.readAsDataURL(f)} $('photo').onchange=handlePhoto;
    function renderOutingPhoto(){const content=outingImageData?`<img id="outingPreview" src="${outingImageData}" alt="探店照片">`:'<div id="outingPhotoHint"><span>＋</span>插入探店照片<br><small>门头、餐点或一起吃饭的瞬间</small></div>';$('outingPhoto').innerHTML=`${content}<input id="outingPhotoInput" type="file" accept="image/*" />`;$('outingPhotoInput').onchange=handleOutingPhoto}
    function handleOutingPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{outingImageData=r.result;renderOutingPhoto()};r.readAsDataURL(f)} $('outingPhotoInput').onchange=handleOutingPhoto;
    function clearOuting(){['outingName','outingAddress','outingDishes'].forEach(id=>$(id).value='');outingImageData='';outingReviews=defaultReviews();renderOutingPhoto();renderOutingReviews()}
    $('saveOuting').onclick=()=>{const name=$('outingName').value.trim();if(!name){$('outingName').focus();alert('先写下这家店的名字吧。');return}const entry={id:Date.now(),name,address:$('outingAddress').value.trim(),dishes:$('outingDishes').value,reviews:outingReviews.map(r=>({name:r.name.trim()||'未命名评价人',rating:r.rating,note:r.note})),image:outingImageData,date:new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})};const entries=allOutings();entries.unshift(entry);try{localStorage.setItem(outingsKey,JSON.stringify(entries))}catch{alert('图片太大，无法保存。请换一张更小的照片。');return}clearOuting();renderOutings()};
    function renderOutings(){const entries=allOutings();$('outingEntries').innerHTML=entries.map(e=>{const photo=e.image?`<img src="${e.image}" alt="${esc(e.name)} 探店照片">`:'<div class="missing-photo"><b>□</b>未插入照片</div>';return `<article class="card outing-card"><div class="card-img">${photo}</div><div class="card-body"><div class="card-date">${esc(e.date)}</div><h3>${esc(e.name)}</h3><p>${esc(e.address||e.dishes||'外出品鉴小记')}</p></div></article>`}).join('');$('outingEmpty').classList.toggle('hidden',entries.length>0)}
    function renderIngredientUpload(){const content=ingredientImageData?`<img id="ingredientPreview" src="${ingredientImageData}" alt="食材准备图">`:'<div id="ingredientUploadHint">＋ 插入食材准备图</div>';$('ingredientUpload').innerHTML=`${content}<input id="ingredientPhoto" type="file" accept="image/*" />`;$('ingredientPhoto').onchange=handleIngredientPhoto}
    function handleIngredientPhoto(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{ingredientImageData=r.result;renderIngredientUpload()};r.readAsDataURL(f)} $('ingredientPhoto').onchange=handleIngredientPhoto;
    function clearForm(){editingId=null;$('title').value=$('duration').value=$('ingredients').value=$('seasoning').value=$('caution').value='';imageData=ingredientImageData='';reviews=defaultReviews();renderReviews();renderUpload();renderIngredientUpload();$('save').textContent='保存这一页 ✿';$('dateLabel').textContent=date.toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'})}
    $('save').onclick=()=>{const title=$('title').value.trim();if(!title){$('title').focus();alert('先给这道菜取个名字吧。');return} const previous=all().find(x=>x.id===editingId);const entry={id:editingId||Date.now(),title,category:$('category').value,duration:String($('duration').value||'').replace(/\s*(分钟|分)\s*$/,'').trim(),ingredients:$('ingredients').value,ingredientImage:ingredientImageData,seasoning:$('seasoning').value,caution:$('caution').value,reviews:reviews.map(r=>({name:r.name.trim()||'未命名评价人',rating:r.rating,note:r.note})),image:imageData,date:previous?.date||new Date().toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'})};let entries=all();entries=editingId?entries.map(x=>x.id===editingId?entry:x):[entry,...entries];try{localStorage.setItem(key,JSON.stringify(entries))}catch{alert('图片太大，无法保存。请换一张更小的照片。');return} clearForm();render();go('memories')};
    function render(){const entries=all();$('entries').innerHTML=entries.map(e=>{const photo=e.image?`<img src="${e.image}" alt="${esc(e.title)} 的成品照片">`:'<div class="missing-photo"><b>□</b>尚未插入照片</div>';return `<article class="card" data-id="${e.id}"><div class="card-img">${photo}</div><div class="card-body"><div class="card-date">${esc(e.date)}</div><h3>${esc(e.title)}</h3></div></article>`}).join('');$('empty').classList.toggle('hidden',entries.length>0);document.querySelectorAll('.card').forEach(c=>c.onclick=()=>show(+c.dataset.id))}
    function editEntry(id){const e=all().find(x=>x.id===id);if(!e)return;editingId=id;$('title').value=e.title||'';$('duration').value=String(e.duration||'').replace(/\s*(分钟|分)\s*$/,'').trim();$('ingredients').value=e.ingredients||'';$('seasoning').value=e.seasoning||'';$('caution').value=e.caution||'';if([...$('category').options].some(o=>o.value===e.category))$('category').value=e.category;reviews=reviewsFromEntry(e);imageData=e.image||'';ingredientImageData=e.ingredientImage||'';renderReviews();renderUpload();renderIngredientUpload();$('save').textContent='更新这一页 ✿';$('dateLabel').textContent=`编辑记录 · ${e.date}`;go('write')}
    const linesFor=(ctx,text,width)=>{const lines=[];let line='';for(const char of String(text||'未记录')){if(ctx.measureText(line+char).width>width&&line){lines.push(line);line=char}else line+=char}if(line)lines.push(line);return lines};
    const loadImage=src=>new Promise(resolve=>{if(!src)return resolve(null);const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>resolve(null);img.src=src});
    async function downloadEntry(id){const e=all().find(x=>x.id===id);if(!e)return;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),main=await loadImage(e.image),ingredient=await loadImage(e.ingredientImage);canvas.width=1200;canvas.height=1800;ctx.fillStyle='#fbf4f5';ctx.fillRect(0,0,1200,1800);ctx.fillStyle='#fffafa';ctx.fillRect(55,55,1090,1690);ctx.fillStyle='#cf7988';ctx.font='700 27px sans-serif';ctx.fillText('料理鼠王 · 料理手账',100,125);ctx.fillStyle='#44352c';ctx.font='700 52px serif';ctx.fillText(e.title||'未命名菜谱',100,210);ctx.fillStyle='#8c7779';ctx.font='28px sans-serif';ctx.fillText(`${e.date} · ${e.category||''}${durationLabel(e.duration)?' · '+durationLabel(e.duration):''}`,100,260);ctx.fillStyle='#f8e8ec';ctx.fillRect(100,305,430,360);if(main)ctx.drawImage(main,100,305,430,360);else{ctx.fillStyle='#b58a94';ctx.font='27px sans-serif';ctx.fillText('尚未插入成品照片',210,495)}let y=740;const section=(title,text,pic)=>{ctx.fillStyle='#cf7988';ctx.font='700 25px sans-serif';ctx.fillText(title,100,y);y+=42;ctx.fillStyle='#44352c';ctx.font='27px sans-serif';linesFor(ctx,text,950).forEach(line=>{ctx.fillText(line,100,y);y+=42});if(pic){ctx.drawImage(pic,100,y,360,200);y+=225}y+=36;ctx.strokeStyle='#eddde0';ctx.beginPath();ctx.moveTo(100,y);ctx.lineTo(1100,y);ctx.stroke();y+=44};section('食材',e.ingredients,ingredient);section('调料与比例',e.seasoning);section('注意事项',e.caution);reviewsFromEntry(e).forEach(r=>section(`${r.name}评价 · ${scoreLabel(r.rating)}`,r.note));canvas.toBlob(blob=>{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${e.title||'料理手账'}.png`;a.click();URL.revokeObjectURL(a.href)},'image/png')}
    function show(id){const e=all().find(x=>x.id===id);if(!e)return;const photo=e.image?`<img src="${e.image}" alt="${esc(e.title)} 的成品照片">`:'<div class="missing-photo"><b>□</b>这页还未插入照片<br><small>点击右上角编辑即可添加</small></div>';const ingredientPhoto=e.ingredientImage?`<img class="ingredient-detail-photo" src="${e.ingredientImage}" alt="食材准备图">`:'';const reviewSections=reviewsFromEntry(e).map(r=>`<div class="section"><h4>${esc(r.name)}评价 · ${scoreLabel(r.rating)}</h4><p>${esc(r.note||'未记录')}</p></div>`).join('');$('detailContent').innerHTML=`<button class="edit-entry" id="editEntry">编辑这一页 ✎</button><button class="download-entry" id="downloadEntry">下载为照片 ⇩</button><div class="detail-grid"><div class="detail-photo">${photo}</div><div><div class="date-line">${esc(e.date)} · ${esc(e.category)}${durationLabel(e.duration)?' · '+durationLabel(e.duration):''}</div><h1>${esc(e.title)}</h1><div class="section"><h4>食材</h4><p>${esc(e.ingredients||'未记录')}</p>${ingredientPhoto}</div><div class="section"><h4>调料与比例</h4><p>${esc(e.seasoning||'未记录')}</p></div><div class="section"><h4>注意事项</h4><p>${esc(e.caution||'未记录')}</p></div>${reviewSections}</div></div>`;$('editEntry').onclick=()=>editEntry(id);$('downloadEntry').onclick=()=>downloadEntry(id);go('detail')};$('back').onclick=()=>{render();go('memories')};renderReviews();renderOutingReviews();renderOutings();render();
  </script>
