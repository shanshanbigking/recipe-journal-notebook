    function show(id){const e=all().find(x=>String(x.id)===String(id));if(!e)return;const photo=e.image?`<img src="${e.image}" alt="${esc(e.title)} 的成品照片">`:'<div class="missing-photo"><b>□</b>这页还未插入照片<br><small>点击右上角编辑即可添加</small></div>';const ingredientPhoto=e.ingredientImage?`<img class="ingredient-detail-photo" src="${e.ingredientImage}" alt="食材准备图">`:'';const reviewSections=reviewsFromEntry(e).map(r=>`<div class="section"><h4>${esc(r.name)}评价 · ${scoreLabel(r.rating)}</h4><p>${esc(r.note||'未记录')}</p></div>`).join('');$('detailContent').innerHTML=`<button class="edit-entry" id="editEntry">编辑这一页 ✎</button><button class="download-entry" id="downloadEntry">下载为照片 ⇩</button><div class="detail-grid"><div class="detail-photo">${photo}</div><div><div class="date-line">${esc(e.date)} · ${esc(e.category)}${durationLabel(e.duration)?' · '+durationLabel(e.duration):''}</div><h1>${esc(e.title)}</h1><div class="section"><h4>食材</h4><p>${esc(e.ingredients||'未记录')}</p>${ingredientPhoto}</div><div class="section"><h4>调料与比例</h4><p>${esc(e.seasoning||'未记录')}</p></div><div class="section"><h4>注意事项</h4><p>${esc(e.caution||'未记录')}</p></div>${reviewSections}</div></div>`;$('editEntry').onclick=()=>editEntry(id);$('downloadEntry').onclick=()=>downloadEntry(id);go('detail')};$('back').onclick=()=>{render();go('memories')};renderReviews();renderOutingReviews();renderOutings();render();storageReady.then(()=>{renderOutings();render();initialiseCloud().catch(error=>{console.error(error);setCloudStatus('共享功能初始化失败：'+error.message)})}).catch(error=>{console.warn('IndexedDB 不可用，暂时继续使用旧存储：',error);initialiseCloud().catch(console.error)});
  </script>
